name: release

# 公开仓库打 v* tag 时，为各平台构建「完整包」并发布到 GitHub Release。
# 完整包内含 dist/ 与生产 node_modules/，目标机器无需 npm/tsc 即可运行。
# 私有仓库（仓库名不匹配）只跑构建前就被 if 跳过，不会发布。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要重新发布的 tag（v 开头）"
        required: true

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'djasdh/agent_search_gateway'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: darwin-x64
            os: macos-15-intel
          - platform: darwin-arm64
            os: macos-15
          - platform: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖并构建
        run: |
          npm ci
          npm run build

      - name: 只保留生产依赖
        run: npm ci --omit=dev

      - name: 打包完整包
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          NAME="agent-search-gateway-${VERSION}-${{ matrix.platform }}"
          STAGE="release/${NAME}"
          mkdir -p "$STAGE"
          cp -r dist node_modules bin package.json package-lock.json \
            gateway.yaml.example secrets.yaml.example scripts runtime \
            README.md LICENSE THIRD_PARTY_LICENSES.md "$STAGE/"
          # 原生 searxng 安装所需资源（Windows / 无 Docker 回退）
          mkdir -p "$STAGE/docker/searxng" "$STAGE/searxng-ext/searx/engines" "$STAGE/searxng-ext/searx/plugins"
          cp docker/searxng/settings.template.yml docker/searxng/quota.config.json "$STAGE/docker/searxng/"
          cp searxng-ext/searx/engines/*.py "$STAGE/searxng-ext/searx/engines/"
          cp searxng-ext/searx/plugins/quota.py "$STAGE/searxng-ext/searx/plugins/"
          cp searxng-ext/LICENSE "$STAGE/searxng-ext/"
          node -e "
            const fs = require('node:fs');
            fs.writeFileSync(
              process.argv[1],
              JSON.stringify({
                version: process.argv[2],
                platform: process.argv[3],
                commit: process.env.GITHUB_SHA || '',
                built_at: new Date().toISOString(),
              }, null, 2) + '\n',
            );
          " "$STAGE/version.json" "$VERSION" "${{ matrix.platform }}"
          if [ "${{ matrix.platform }}" = "win32-x64" ]; then
            # Git Bash 的 GNU tar 不支持 -a 生成 zip；用 Compress-Archive。
            # 优先 pwsh 7：.NET Core 写标准 / 分隔符；PS 5.1 会写 \，其他工具兼容性差。
            if command -v pwsh >/dev/null 2>&1; then
              pwsh -NoProfile -NonInteractive -Command "Compress-Archive -LiteralPath 'release/${NAME}' -DestinationPath 'release/${NAME}.zip' -CompressionLevel Optimal"
            else
              powershell -NoProfile -NonInteractive -Command "Compress-Archive -LiteralPath 'release/${NAME}' -DestinationPath 'release/${NAME}.zip' -CompressionLevel Optimal"
            fi
          else
            tar -czf "release/${NAME}.tar.gz" -C release "$NAME"
          fi
          ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            release/*.tar.gz
            release/*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.repository == 'djasdh/agent_search_gateway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成 SHA256SUMS 与 runtime.json
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          node scripts/install/make-runtime.mjs artifacts runtime/pins.json "$VERSION" artifacts/runtime.json
          cat artifacts/runtime.json

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          gh release create "$TAG" artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS artifacts/runtime.json \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
